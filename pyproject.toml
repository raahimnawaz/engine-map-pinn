[project]
name = "enginemap"
version = "0.1.0"
description = "Physics-informed neural surrogate of a V12 engine map (Aventador SVJ), reconstructing torque/power/BSFC maps from sparse dyno data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Raahim Nawaz" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.1",
    "matplotlib>=3.7",
    "pandas>=2.0",
]

[project.optional-dependencies]
# ruff is pinned to a minor: it expands its DEFAULT rule set between minors
# (0.16 added I/RUF/UP/PLR/SIM/C4/BLE), which silently red-lights CI on commits
# that changed no Python at all. Bump deliberately, not by surprise.
dev = ["pytest>=7.4", "ruff>=0.16,<0.17"]
control = ["casadi>=3.6"]   # MPCC scaffold (enginemap/mpcc.py)

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# E702: allow compact `a; b` statements in the figure-plotting script
ignore = ["E702"]

[tool.pytest.ini_options]
pythonpath = ["src"]
